<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hilfekarten Zwei Klammern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
/* Layout: eine schmale Spalte, drei Schritte, je Schritt gestapelte Hilfen, die sich nacheinander freischalten */
:root{
  --bg:#f3ece0; --card:#fffaf1; --ink:#2b2016; --soft:#6b5a45; --kraft:#dcc196; --kraft2:#c9a774;
  --night:#1a1f25; --hazard:#f2c230; --blue:#2f6fa8; --red:#c4422e; --line:#e2d4bb; --lock:#ece3d3;
  --display:'Bungee','Arial Black',sans-serif; --body:'Atkinson Hyperlegible',Verdana,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171b20; --card:#222830; --ink:#ece6db; --soft:#a9b2bc; --kraft:#6e5a3c; --kraft2:#8a7048;
  --night:#0f1216; --hazard:#f2c230; --blue:#7fb2e5; --red:#ec7a64; --line:#343c47; --lock:#1d2229; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171b20; --card:#222830; --ink:#ece6db; --soft:#a9b2bc; --kraft:#6e5a3c; --kraft2:#8a7048;
  --night:#0f1216; --hazard:#f2c230; --blue:#7fb2e5; --red:#ec7a64; --line:#343c47; --lock:#1d2229; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;margin:0}
.top{background:var(--night);color:#ece6db}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,#111 12px 24px)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{padding-block:22px 26px}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#a3acb6;font-weight:700}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:6px 0 10px;color:var(--hazard);text-wrap:balance}
.top p{margin:0;max-width:60ch;color:#d9d2c6}
main .wrap{padding-block:24px 48px;display:flex;flex-direction:column;gap:32px}
section{display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .n{font-family:var(--display);font-weight:400;font-size:15px;background:var(--kraft);color:var(--ink);padding:3px 10px;border-radius:4px}
h2 .sub{font-weight:400;font-size:16px;color:var(--soft)}
.hint{background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.hint>button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:60px;font-weight:700;font-size:18px}
.hint>button:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.badge{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);font-size:18px}
.hint.open .badge{background:var(--hazard);color:#2b2016;border-color:#2b2016}
.chev{margin-left:auto;transition:transform .2s}
.hint.open .chev{transform:rotate(180deg)}
.hint.locked{background:var(--lock);border-style:dashed}
.hint.locked>button{cursor:not-allowed;color:var(--soft);font-weight:400}
.hint.locked .badge{border-color:var(--soft)}
.body{padding:4px 18px 18px 68px;display:flex;flex-direction:column;gap:8px}
.body p{margin:0;max-width:60ch}
.math{font-size:20px;background:var(--bg);border-radius:6px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:pre;overflow-x:auto;max-width:100%}
.vz{border-collapse:collapse;font-size:20px;text-align:center}.vz th,.vz td{border:2px solid var(--line);padding:4px 16px}.vz th{font-size:18px;color:var(--soft)}.vz td{min-width:60px}
.math b{color:var(--red)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:2px solid var(--line);padding-top:18px;color:var(--soft);font-size:16px}
.foot button{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px 16px;cursor:pointer;min-height:44px}
.foot button:focus-visible{outline:3px solid var(--blue)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:480px){.body{padding-left:18px}.math{font-size:16px;padding:6px 8px}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

</head>
<body>
<header class="top"><div class="stripe"></div><div class="wrap">
  <div class="eyebrow">Lernpfad · Produkt aus zwei Klammern</div>
  <h1>Hilfekarten</h1>
  <p>Öffne immer zuerst Hilfe 1. Hilft sie dir nicht weiter, wird danach die nächste Hilfe frei. Kreise auf deinem Lernpfad ein, welche Hilfen du benutzt hast.</p>
</div></header>

<main><div class="wrap" id="app"></div></main>

<script>
const IMG = {};
const GT = (rows) => `<table class="vz">${rows.map((r, i) => `<tr>${r.map((c, j) => (i === 0 || j === 0) ? `<th>${c}</th>` : `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const STEPS = [
  { id: 's1', title: 'Die erweiterte Packstation', sub: 'Wer hat recht: Mia oder Ben?', hints: [
    ['Zähle Reihen und Spalten.', `<p>Nach der Erweiterung hat die Packstation 4 + 2 = 6 Reihen und 6 + 3 = 9 Spalten.</p><div class="math">(4 + 2) · (6 + 3) = 6 · 9</div><p>Ziehe davon die 4 · 6 = 24 bisherigen Fächer ab. So viele Fächer kommen dazu.</p>`],
    ['Zerlege in vier Rechtecke.', `<p>Die erweiterte Packstation besteht aus vier Rechtecken:</p><p><strong>alt:</strong> 4 Reihen · 6 Spalten<br><strong>rechts:</strong> 4 Reihen · 3 Spalten<br><strong>unten:</strong> 2 Reihen · 6 Spalten<br><strong>Ecke unten rechts:</strong> 2 Reihen · 3 Spalten</p><p>Drei davon sind neu.</p>`],
    ['Was fehlt bei Mia?', `<p>Mia rechnet:</p><div class="math">2 · 6 + 3 · 4</div><p>Das sind die Rechtecke unten und rechts. Welches neue Rechteck hat sie nicht mitgezählt?</p>`],
  ]},
  { id: 's2', title: 'Die Regel', sub: 'Gittertabelle und Distributivgesetz', hints: [
    ['So funktioniert die Gittertabelle.', `<p>Die Glieder der ersten Klammer stehen links, die der zweiten oben. In jedes Feld kommt das Produkt aus Zeile und Spalte. Am Ende werden alle Felder addiert.</p><p>Beispiel mit Zahlen aus Schritt 1:</p>${GT([['·', '6', '3'], ['4', '24', '12'], ['2', '12', '6']])}<div class="math">(4 + 2) · (6 + 3) = 24 + 12 + 12 + 6 = 54</div>`],
    ['Distributivgesetz zweimal.', `<p>Betrachte (b + 3) als ein Glied und multipliziere zuerst mit a und mit 2:</p><div class="math">(a + 2) · (b + 3) = a · (b + 3) + 2 · (b + 3)</div><p>Löse dann beide Klammern auf, wie du es schon kannst.</p>`],
    ['Vorzeichen in der Gittertabelle.', `<p>Schreibe jedes Glied <strong>mit seinem Vorzeichen</strong> in die Tabelle. Beispiel:</p>${GT([['·', 'x', '+4'], ['x', 'x²', '4x'], ['−2', '−2x', '−8']])}<div class="math">(x − 2) · (x + 4) = x² + 4x − 2x − 8 = x² + 2x − 8</div>`],
  ]},
  { id: 's3', title: 'Üben', sub: 'Basis, Standard, Experte', hints: [
    ['So gehst du vor.', `<p><strong>1.</strong> Gittertabelle zeichnen. <strong>2.</strong> Vier Produkte bilden. <strong>3.</strong> Gleichartige Glieder zusammenfassen.</p><div class="math">(3x − 2) · (x + 4) = 3x² + 12x − 2x − 8 = 3x² + 10x − 8</div><p>Achte auf die Vorzeichen: (−2) · 4 = −8.</p>`],
    ['Gleichungen, bei denen x² wegfällt.', `<p>Multipliziere beide Seiten aus. Subtrahiere dann die Glieder mit x² auf beiden Seiten:</p><div class="math">(x + 1) · (x + 4) = (x + 2) · (x + 2)</div><div class="math">x² + 5x + 4 = x² + 4x + 4   | − x²</div><div class="math">5x + 4 = 4x + 4   | − 4x − 4</div><div class="math">x = 0</div><p>Bei der Sachaufgabe g): Neue Fläche minus alte Fläche = 56.</p>`],
    ['Drei Glieder oder drei Faktoren.', `<p>Bei drei Gliedern wird die Gittertabelle größer, zum Beispiel 3 × 2 Felder:</p>${GT([['·', 'a', '−1'], ['a', '', ''], ['b', '', ''], ['+2', '', '']])}<p>Bei drei Faktoren multiplizierst du zuerst zwei Klammern und dann das Ergebnis mit der dritten Klammer.</p>`],
  ]},
];
const KEY = 'hilfen-zwei-v1';
let open = {};
try { open = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { open = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(open)); } catch (e) {} };
let shown = {}; // aktuell aufgeklappt
let asking = false;

function render() {
  const app = document.getElementById('app');
  let html = '';
  for (const s of STEPS) {
    html += `<section aria-labelledby="h-${s.id}"><h2 id="h-${s.id}"><span class="n">Schritt ${s.id.slice(1)}</span>${s.title}<span class="sub">${s.sub}</span></h2>`;
    s.hints.forEach(([title, body], i) => {
      const k = s.id + '-' + i;
      const unlocked = i === 0 || open[s.id + '-' + (i - 1)];
      const isOpen = !!shown[k];
      const label = unlocked ? `Hilfe ${i + 1}${open[k] ? ' · ' + title : ''}` : `Hilfe ${i + 1} · erst Hilfe ${i} öffnen`;
      html += `<div class="hint${isOpen ? ' open' : ''}${unlocked ? '' : ' locked'}">
        <button id="b-${k}" data-k="${k}" aria-expanded="${isOpen}" ${unlocked ? '' : 'aria-disabled="true"'}>
          <span class="badge">${unlocked ? i + 1 : '–'}</span><span>${label}</span>${unlocked ? '<span class="chev" aria-hidden="true">▾</span>' : ''}
        </button>${isOpen ? `<div class="body">${body.replace(/__(\w+)/g, (_, n) => IMG[n] || '')}</div>` : ''}</div>`;
    });
    html += '</section>';
  }
  const used = Object.keys(open).length;
  html += `<div class="foot"><span>Geöffnete Hilfen auf diesem Gerät: <strong>${used}</strong></span>` +
    (asking ? `<span class="confirm">Wirklich alles zurücksetzen? <button id="yes">Ja, zurücksetzen</button><button id="no">Abbrechen</button></span>`
            : `<button id="reset">Für die nächste Person zurücksetzen</button>`) + '</div>';
  app.innerHTML = html;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'reset') { asking = true; render(); return; }
  if (b.id === 'no') { asking = false; render(); return; }
  if (b.id === 'yes') { open = {}; shown = {}; asking = false; save(); render(); return; }
  const k = b.dataset.k; if (!k || b.getAttribute('aria-disabled')) return;
  shown[k] = !shown[k]; if (shown[k]) { open[k] = true; save(); }
  render(); document.getElementById('b-' + k)?.focus();
});
render();
</script>

</body>
</html>
