<meta charset="utf-8">
<title>Escape aus der Packstation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bungee&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: nächtliche Lagerhalle; Aufträge als Kraftpapier-Etiketten auf Beton, Warnstreifen für gesperrte Tore */
:root {
  --night: #1a1f25; --concrete: #252c34; --concrete-2: #2f3842; --line: #3d4753;
  --fg: #ece6db; --muted: #a3acb6;
  --kraft: #dcc196; --kraft-2: #c9a774; --ink: #2b2016; --ink-soft: #5c4a35;
  --hazard: #f2c230; --stamp: #c4422e; --ok: #3e9b5c; --warn: #e3a52a; --bad: #c4422e;
  --f-display: 'Bungee', 'Arial Black', Impact, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, .key, .opt, .chip, .lvl, .door { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.key, .opt, .chip, .lvl, .door, .btn { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-appearance: none; appearance: none; border-radius: 6px; }
body { background: var(--night); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  background-image: radial-gradient(ellipse at 50% -10%, #2b3540 0%, transparent 60%), repeating-linear-gradient(90deg, transparent 0 119px, rgba(255,255,255,.025) 119px 120px); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
i { font-family: 'Times New Roman', Georgia, serif; font-size: 1.08em; }
.mono { font-family: var(--f-mono); letter-spacing: .04em; }
.hazard { height: 10px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 14px, #1a1a1a 14px 28px); border-radius: 2px; }

/* Kopfleiste */
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.bar .who { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.codezettel { display: flex; gap: 6px; align-items: center; background: var(--kraft); color: var(--ink); padding: 6px 10px; border-radius: 3px; transform: rotate(-1.2deg); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.codezettel .lbl { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin-right: 4px; }
.codezettel .d { width: 26px; height: 30px; display: grid; place-items: center; border: 1.5px dashed var(--ink-soft); border-radius: 3px; font-family: var(--f-display); font-size: 17px; }
.codezettel .d.on { border-style: solid; border-color: var(--ink); background: #efe0c4; }
.codezettel .d small { font-family: var(--f-mono); font-size: 9px; display: block; line-height: 1; color: var(--ink-soft); }

/* Start */
.sign { font-family: var(--f-display); font-size: clamp(30px, 6.4vw, 54px); line-height: 1.02; color: var(--hazard); letter-spacing: .01em; }
.sign span { color: var(--fg); display: block; font-size: .55em; }
.lead { font-size: 18px; max-width: 60ch; color: var(--fg); }
.panel { background: var(--concrete); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.start-grid { display: grid; gap: 18px; grid-template-columns: 1.6fr 1fr; align-items: start; margin-top: 18px; }
@media (max-width: 860px) { .start-grid { grid-template-columns: 1fr; } }
.start-grid .levels { grid-template-columns: 1fr; }
@media (min-width: 560px) and (max-width: 860px) { .start-grid .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
label.f { display: block; font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
input.txt { width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 8px; border: 2px solid var(--line); background: #141920; color: var(--fg); }
input.txt:focus { border-color: var(--hazard); outline: none; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 8px; padding: 13px 20px; font-weight: 700; font-size: 17px; background: var(--hazard); color: #1a1a1a; box-shadow: 0 4px 0 #a9831a; transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a9831a; }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--line); box-shadow: none; }
.btn.dark { background: var(--ink); color: var(--kraft); box-shadow: 0 4px 0 #000; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
details.teacher { margin-top: 18px; color: var(--muted); font-size: 15px; }
details.teacher summary { cursor: pointer; font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
details.teacher ol { padding-left: 20px; margin: 10px 0 0; }
.rules { display: grid; gap: 8px; font-size: 15px; color: var(--muted); }
.rules b { color: var(--fg); }

/* Hallenplan */
.plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 640px) { .plan { grid-template-columns: repeat(2, 1fr); } }
.door { position: relative; min-height: 168px; border-radius: 8px; border: 2px solid var(--line); background: var(--concrete); color: var(--fg); text-align: left; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.door::before { content: ""; position: absolute; inset: 44px 10px 10px; background: repeating-linear-gradient(0deg, var(--concrete-2) 0 9px, #222930 9px 11px); border-radius: 4px; opacity: .9; }
.door > * { position: relative; }
.door .hall { font-family: var(--f-display); font-size: 30px; line-height: 1; color: var(--hazard); }
.door .nm { font-weight: 700; font-size: 15px; }
.door .tp { font-size: 13px; color: var(--muted); }
.door.locked { cursor: not-allowed; }
.door.locked .hall { color: var(--muted); }
.door.locked::after { content: ""; position: absolute; left: -10%; right: -10%; top: 58%; height: 16px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #1a1a1a 12px 24px); transform: rotate(-8deg); opacity: .85; }
.door.open { border-color: var(--hazard); box-shadow: 0 0 0 4px rgba(242,194,48,.12); }
@media (hover: hover) { .door.open:hover { transform: translateY(-2px); } .opt:hover { background: #fff6e6; } }
.door.done { border-color: var(--ok); }
.door .stamp { position: absolute; right: 10px; bottom: 14px; font-family: var(--f-display); font-size: 15px; color: var(--ok); border: 2.5px solid var(--ok); padding: 2px 8px; transform: rotate(-9deg); border-radius: 4px; background: rgba(26,31,37,.85); }
.door.exit .hall { color: var(--fg); }
.door .lock { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Halle */
.hallhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; margin-bottom: 10px; }
.hallhead .h { font-family: var(--f-display); font-size: clamp(22px, 4.6vw, 34px); color: var(--hazard); line-height: 1.05; }
.hallhead .h small { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.pips { display: flex; gap: 6px; }
.pip { width: 34px; height: 10px; border-radius: 2px; background: var(--line); }
.pip.cur { background: var(--hazard); }
.pip.p2 { background: var(--ok); } .pip.p1 { background: var(--warn); } .pip.p0 { background: var(--bad); }
.intro { color: var(--muted); margin: 0 0 14px; max-width: 65ch; }

.label { background: var(--kraft); color: var(--ink); border-radius: 6px; padding: 0; box-shadow: 0 10px 24px rgba(0,0,0,.35), 0 2px 0 var(--kraft-2); position: relative; overflow: hidden; }
.label .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 2px dashed var(--kraft-2); }
.label .top .mono { font-size: 13px; font-weight: 600; }
.barcode { height: 22px; width: 120px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 12px); opacity: .8; }
.label .body { padding: 18px 18px 20px; display: grid; gap: 14px; }
.prompt { font-size: 20px; line-height: 1.5; }
.visual { display: flex; justify-content: center; }
.visual svg { max-width: 100%; height: auto; }
.answer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.answer input { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 22px; padding: 10px 14px; border-radius: 6px; border: 2px solid var(--ink-soft); background: #f6ecda; color: var(--ink); font-variant-numeric: tabular-nums; }
.answer input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(43,32,22,.2); }
.answer input.right { border-color: var(--ok); background: #e5f1e3; }
.answer input.wrong { border-color: var(--bad); }
.answer .pre { font-size: 20px; font-weight: 700; min-width: 3.2em; }
.tbl { border-collapse: collapse; font-size: 19px; }
.tbl th, .tbl td { border: 2px solid var(--ink-soft); padding: 6px 10px; text-align: center; }
.tbl th { background: #e8d4b0; }
.tbl input { width: 84px; font: inherit; font-size: 19px; padding: 6px; border: 1.5px solid var(--ink-soft); border-radius: 4px; background: #f6ecda; color: var(--ink); text-align: center; }
.opts { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { background: #f6ecda; color: var(--ink); border: 2px solid var(--ink-soft); border-radius: 8px; padding: 14px; font-size: 20px; text-align: center; }
.opt.sel { background: var(--ink); color: var(--kraft); border-color: var(--ink); }
.opt.bad { border-color: var(--bad); background: #f3d6cf; color: #7a2a1d; text-decoration: line-through; }
.opt.good { border-color: var(--ok); background: #d9ecd6; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { min-width: 74px; padding: 14px 12px; border-radius: 6px; border: 2px solid var(--ink-soft); background: #e9d3aa; color: var(--ink); font-size: 21px; box-shadow: 0 3px 0 var(--kraft-2); }
.chip.sel { background: var(--ink); color: var(--kraft); }
.keypad { display: grid; gap: 6px; }
.key { min-width: 44px; height: 44px; padding: 0 10px; border-radius: 6px; border: 1.5px solid var(--ink-soft); background: #efe0c4; color: var(--ink); font-size: 19px; }
.key:active { background: #e2cda6; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.msg { border-radius: 6px; padding: 10px 14px; font-size: 16px; }
.msg.ok { background: #d9ecd6; color: #1f4d2c; border-left: 6px solid var(--ok); }
.msg.no { background: #f3d6cf; color: #6e2416; border-left: 6px solid var(--bad); }
.msg.info { background: #efe0c4; color: var(--ink); border-left: 6px solid var(--ink-soft); }
.msg.hint { background: #fbf1c9; color: #4a3a07; border-left: 6px solid var(--hazard); }
.msg b { display: block; }
.tries { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); }

/* Tor offen / Ausgang */
.reveal { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 28px 18px; }
.bigdigit { font-family: var(--f-display); font-size: 84px; line-height: 1; color: var(--ink); background: var(--kraft); width: 120px; height: 130px; display: grid; place-items: center; border-radius: 8px; box-shadow: 0 8px 0 var(--kraft-2); animation: drop .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes drop { from { transform: translateY(-30px) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bigdigit { animation: none; } .door.open:hover { transform: none; } }
.vault { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.vault input { width: 56px; height: 70px; font-family: var(--f-display); font-size: 34px; text-align: center; border-radius: 8px; border: 3px solid var(--line); background: #11161c; color: var(--hazard); }
.vault input:focus { border-color: var(--hazard); outline: none; }
.vault .cap { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }

/* Auswertung */
.report-head { display: grid; gap: 6px; margin-bottom: 18px; }
.cards { display: grid; gap: 12px; }
.acard { display: grid; grid-template-columns: 70px 1fr; gap: 14px; background: var(--concrete); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.lamp { display: grid; gap: 5px; align-content: start; justify-items: center; background: #11161c; border-radius: 8px; padding: 8px 0; }
.lamp i { all: unset; width: 18px; height: 18px; border-radius: 50%; background: #2a3038; }
.lamp.rot i:nth-child(1) { background: var(--bad); box-shadow: 0 0 12px var(--bad); }
.lamp.gelb i:nth-child(2) { background: var(--hazard); box-shadow: 0 0 12px var(--hazard); }
.lamp.gruen i:nth-child(3) { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
.acard h3 { font-size: 18px; }
.acard .meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.acard p { margin: 6px 0 0; }
.acard ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.acard .todo { display: inline-block; margin-top: 8px; font-weight: 700; }
.laufzettel { margin-top: 18px; background: var(--kraft); color: var(--ink); border-radius: 6px; padding: 16px 18px; display: grid; gap: 8px; }
.laufzettel .code { font-family: var(--f-mono); font-size: 18px; font-weight: 600; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.levels { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 640px) { .levels { grid-template-columns: 1fr; } }
.lvl { text-align: left; border: 2px solid var(--line); background: #141920; color: var(--fg); border-radius: 8px; padding: 12px; display: grid; gap: 4px; }
.lvl .st { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lvl .nm { font-family: var(--f-display); font-size: 17px; color: var(--hazard); }
.lvl .ds { font-size: 14px; color: var(--muted); }
.lvl .boxes { display: flex; gap: 3px; } .lvl .boxes span { width: 12px; height: 12px; border: 1.5px solid var(--kraft-2); border-radius: 2px; } .lvl .boxes span.on { background: var(--kraft); }
.lvl[aria-pressed="true"] { border-color: var(--hazard); background: #2a2b20; box-shadow: 0 0 0 3px rgba(242,194,48,.18); }
.lvlchip { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--hazard); border: 1.5px solid var(--hazard); border-radius: 4px; padding: 3px 8px; text-transform: uppercase; }
.reveal .levels { width: 100%; max-width: 640px; }
.suggest { font-size: 15px; max-width: 52ch; }
.padwrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.digits { display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; }
.digits .key { min-width: 0; width: 48px; }
.syms { display: flex; flex-wrap: wrap; gap: 6px; max-width: 290px; }
.key.wide { min-width: 70px; }
.devkbd { background: none; border: 0; color: var(--ink-soft); font-size: 13px; text-decoration: underline; padding: 4px 0; }
.space { height: 14px; }
</style>

<script>
/* ===== Engine: Parser, Zufall, Aufgaben ===== */
(function (G) {
  'use strict';

  // ---------- Zufall ----------
  function rng(seed) {
    let a = seed >>> 0;
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.shuffle = arr => { const a2 = arr.slice(); for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; } return a2; };
    return r;
  }

  // ---------- Parser ----------
  function normalize(s) {
    return String(s).toLowerCase()
      .replace(/[−–—]/g, '-')
      .replace(/[·⋅×*]/g, '*')
      .replace(/[:÷]/g, '/')
      .replace(/²/g, '^2').replace(/³/g, '^3')
      .replace(/,/g, '.')
      .replace(/\s+/g, '');
  }
  function tokenize(src) {
    const t = []; let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (/[0-9.]/.test(c)) { let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++; const v = src.slice(i, j); if ((v.match(/\./g) || []).length > 1 || v === '.') throw new Error('zahl'); t.push({ k: 'n', v: parseFloat(v) }); i = j; continue; }
      if (/[a-z]/.test(c)) { t.push({ k: 'v', v: c }); i++; continue; }
      if ('+-*/^()'.includes(c)) { t.push({ k: c }); i++; continue; }
      throw new Error('zeichen');
    }
    // implizites Mal
    const out = [];
    for (let k = 0; k < t.length; k++) {
      const a = t[k], b = t[k + 1];
      out.push(a);
      if (b && (a.k === 'n' || a.k === 'v' || a.k === ')') && (b.k === 'v' || b.k === '(' || (b.k === 'n' && a.k !== 'n'))) out.push({ k: '*' });
    }
    return out;
  }
  function parse(str) {
    const toks = tokenize(normalize(str)); let p = 0;
    const peek = () => toks[p], eat = k => { if (!toks[p] || toks[p].k !== k) throw new Error('syntax'); return toks[p++]; };
    function expr() { let n = term(); while (peek() && (peek().k === '+' || peek().k === '-')) { const op = toks[p++].k; const r = term(); n = { op, a: n, b: r }; } return n; }
    function term() { let n = factor(); while (peek() && (peek().k === '*' || peek().k === '/')) { const op = toks[p++].k; const r = factor(); n = { op, a: n, b: r }; } return n; }
    function factor() { if (peek() && peek().k === '-') { p++; return { op: 'neg', a: factor() }; } if (peek() && peek().k === '+') { p++; return factor(); } return power(); }
    function power() { const b = primary(); if (peek() && peek().k === '^') { p++; const e = factor(); return { op: '^', a: b, b: e }; } return b; }
    function primary() {
      const t = peek(); if (!t) throw new Error('ende');
      if (t.k === 'n') { p++; return { num: t.v }; }
      if (t.k === 'v') { p++; return { v: t.v }; }
      if (t.k === '(') { p++; const e = expr(); eat(')'); return e; }
      throw new Error('syntax');
    }
    if (!toks.length) throw new Error('leer');
    const tree = expr(); if (p !== toks.length) throw new Error('syntax');
    return tree;
  }
  function evalT(n, env) {
    if ('num' in n) return n.num;
    if ('v' in n) { if (!(n.v in env)) return NaN; return env[n.v]; }
    switch (n.op) {
      case 'neg': return -evalT(n.a, env);
      case '+': return evalT(n.a, env) + evalT(n.b, env);
      case '-': return evalT(n.a, env) - evalT(n.b, env);
      case '*': return evalT(n.a, env) * evalT(n.b, env);
      case '/': return evalT(n.a, env) / evalT(n.b, env);
      case '^': return Math.pow(evalT(n.a, env), evalT(n.b, env));
    }
    return NaN;
  }
  function varsOf(n, s = new Set()) { if (!n) return s; if ('v' in n) s.add(n.v); if (n.a) varsOf(n.a, s); if (n.b) varsOf(n.b, s); return s; }
  const PTS = [1.7, -2.3, 3.1, 0.6, -1.45, 2.55];
  function equiv(t1, t2) {
    const vs = [...new Set([...varsOf(t1), ...varsOf(t2)])];
    for (let i = 0; i < PTS.length; i++) {
      const env = {}; vs.forEach((v, j) => env[v] = PTS[(i + j * 2) % PTS.length] + j * 0.37);
      const a = evalT(t1, env), b = evalT(t2, env);
      if (!isFinite(a) || !isFinite(b)) return false;
      if (Math.abs(a - b) > 1e-7 * Math.max(1, Math.abs(a), Math.abs(b))) return false;
    }
    return true;
  }
  // Anzahl der Summanden auf oberster Ebene
  function termCount(raw) {
    const s = normalize(raw); let depth = 0, count = 0, inTerm = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '(') depth++;
      if (c === ')') depth--;
      if ((c === '+' || c === '-') && depth === 0 && i > 0 && !'^*/'.includes(s[i - 1])) { inTerm = false; continue; }
      if (c === '+' || c === '-') continue;
      if (!inTerm) { count++; inTerm = true; }
    }

  // ---------- Prüfen ----------
  // Variablen umbenennen
  function rename(n, map) {
    if ('num' in n) return n;
    if ('v' in n) return { v: map[n.v] || n.v };
    const o = { op: n.op, a: rename(n.a, map) }; if (n.b) o.b = rename(n.b, map); return o;
  }
  function perms(arr) { if (arr.length <= 1) return [arr]; return arr.flatMap((x, i) => perms(arr.slice(0, i).concat(arr.slice(i + 1))).map(r => [x].concat(r))); }
  // gleich bis auf die Wahl der Buchstaben?
  function equivFree(t, target) {
    const vs = [...varsOf(t)], vt = [...varsOf(target)];
    if (vs.length !== vt.length) return false;
    if (vs.length > 3) return equiv(t, target);
    return perms(vt).some(pm => { const map = {}; vs.forEach((v, i) => map[v] = pm[i] + '_'); const tt = rename(t, map); const mp = {}; vt.forEach(v => mp[v] = v + '_'); return equiv(tt, rename(target, mp)); });
  }

</script>
<script>
(function () {
  'use strict';
  const E = window.Engine;
  const KEY = 'packstation-8d-v1';

  const $ = s => document.querySelector(s);
  const app = $('#app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let S = null, TASKS = [];
  function fresh(name, level) {
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;

  }
  function load() { try { const raw = localStorage.getItem(KEY); const o = raw ? JSON.parse(raw) : null; return o && o.v === 2 ? o : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
  function wipe() { try { localStorage.removeItem(KEY); } catch (e) { } }
  function boot(state) { S = state; TASKS = E.makeTasks(S.seed); }
  const lvlOf = h => h === 'X' ? 0 : (S.hallLevel[h] || S.level);
  const tasksOf = h => TASKS.filter(t => t.area === h && t.level === lvlOf(h));
  const LV = E.LEVELS;
  function levelCards(cur, idp) {
    return `<div class="levels" role="group" aria-label="Schwierigkeitsstufe">${[1, 2, 3].map(l => `<button type="button" class="lvl" id="${idp}${l}" data-lvl="${l}" aria-pressed="${cur === l}"><span class="st">${LV[l].short}</span><span class="nm">${LV[l].name}</span><span class="boxes">${[1, 2, 3].map(i => `<span class="${i <= l ? 'on' : ''}"></span>`).join('')}</span><span class="ds">${LV[l].desc}</span></button>`).join('')}</div>`;
  }

  const hallDone = h => tasksOf(h).every(t => S.res[t.id] && S.res[t.id].done);
  const unlockedCount = () => { let n = 0; for (const h of HALLS) { if (hallDone(h)) n++; else break; } return n; };
  const minutes = () => Math.max(1, Math.round(((S.finishedAt || Date.now()) - S.startedAt) / 60000));

  // ---------- Bausteine ----------
  function bar() {
    const d = HALLS.map(h => `<div class="d ${S.got[h] ? 'on' : ''}" title="Halle ${h}">${S.got[h] ? S.digits[h] : ''}</div>`).join('');

    return `<div class="bar"><div class="row" style="gap:10px"><div class="who">Schicht 8d · ${esc(S.name)} · ${minutes()} min</div><span class="lvlchip">${LV[lv] ? LV[lv].short + ' · ' + LV[lv].name : 'Bonus'}</span></div>
      <div class="codezettel" aria-label="Codezettel"><span class="lbl">Code</span>${d}</div></div>`;
  }
  function stackSVG(d, s) {
    const B = 16, G = 3, figs = [1, 2, 3];
    const w = figs.reduce((acc, n) => acc + Math.max(d, s) * (B + G) + 34, 0);
    const h = (3 + 1) * (B + G) + 28;
    let x = 10, out = '';

      const cols = Math.max(d, s), fw = cols * (B + G);
      for (let i = 0; i < s; i++) out += `<rect x="${x + i * (B + G)}" y="${h - 22 - B}" width="${B}" height="${B}" rx="2" fill="#f6ecda" stroke="#5c4a35"/>`;
      for (let r = 0; r < n; r++) for (let c = 0; c < d; c++) out += `<rect x="${x + c * (B + G)}" y="${h - 22 - B - (r + 1) * (B + G)}" width="${B}" height="${B}" rx="2" fill="#c9a774" stroke="#5c4a35"/>`;
      out += `<text x="${x + fw / 2 - 2}" y="${h - 4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#2b2016">Figur ${n}</text>`;
      x += fw + 34;

  }

          <li>Punkte pro Auftrag: 2 beim ersten Versuch ohne Tipp, 1 mit Tipp oder im 2./3. Versuch, 0 wenn die Lösung angezeigt wurde. Pro Halle sind 8 Punkte möglich. Ampel: Stufe 1: 7–8 gelb, sonst rot · Stufe 2: 7–8 grün, 4–6 gelb, 0–3 rot · Stufe 3: 5–8 grün, 2–4 gelb, 0–1 rot.</li>

  }

  function renderMap() {

  // ---------- Aufgabe ----------

    const cb = $('#checkBtn'); if (cb) cb.addEventListener('click', () => submit(t));
    $('#hintBtn').addEventListener('click', () => { r.hint = true; save(); showHint(t); });
    $('#backBtn').addEventListener('click', () => { S.screen = h === 'X' ? 'report' : 'map'; save(); render(); });
  }
  function showHint(t) {
    const m = $('#msg'); if (!m) return;
    if (!m.querySelector('.hint')) m.insertAdjacentHTML('afterbegin', `<div class="msg hint"><b>Tipp</b>${t.hint}</div>`);
    const hb = $('#hintBtn'); if (hb) hb.disabled = true;
  }
  function setMsg(kind, title, text) {
    const m = $('#msg'); const hint = m.querySelector('.hint');
    m.innerHTML = (hint ? hint.outerHTML : '') + `<div class="msg ${kind}" style="margin-top:${hint ? 8 : 0}px"><b>${title}</b>${text || ''}</div>`;
  }
  function collect(t) {
    if (t.type === 'term' || t.type === 'num') return $('#in0').value;
    if (t.type === 'pair') return t.labels.map((_, i) => $('#in' + i).value);
    if (t.type === 'table') return t.xs.map((_, i) => $('#in' + i).value);
    if (t.type === 'multi') return [...multiSel];
  }
  function submit(t, mcIndex) {
    const r = S.res[t.id]; if (r.done) return;
    const ans = t.type === 'mc' ? mcIndex : collect(t);
    if (t.type !== 'mc' && t.type !== 'multi' && [].concat(ans).some(a => !String(a).trim())) { setMsg('info', 'Noch leer', 'Trage zuerst eine Antwort ein.'); return; }
    if (t.type === 'multi' && !ans.length) { setMsg('info', 'Noch nichts ausgewählt', 'Tippe die passenden Pakete an.'); return; }
    const res = E.check(t, ans);
    if (res.invalid) { setMsg('info', 'Nicht lesbar', res.invalid); return; }
    if (res.ok) {
      r.done = true; r.pts = (r.tries === 0 && !r.hint) ? 2 : 1; save();
      if (t.type === 'mc') app.querySelector(`.opt[data-i="${mcIndex}"]`).classList.add('good');
      app.querySelectorAll('.answer input, .tbl input').forEach(i => { i.classList.add('right'); i.readOnly = true; });
      setMsg('ok', r.pts === 2 ? 'Richtig! 2 Punkte.' : 'Richtig! 1 Punkt.', `Lösung: ${t.solution}`);
      nextButton();
      return;
    }
    r.tries++;
    if (res.tag && !r.tags.includes(res.tag)) r.tags.push(res.tag);
    if (t.type === 'mc') { const b = app.querySelector(`.opt[data-i="${mcIndex}"]`); b.classList.add('bad'); b.disabled = true; }
    if (res.partial) app.querySelectorAll('.answer input, .tbl input').forEach((i, k) => { i.classList.toggle('wrong', !res.partial[k]); i.classList.toggle('right', !!res.partial[k]); });
    else app.querySelectorAll('.answer input').forEach(i => i.classList.add('wrong'));
    if (r.tries >= 3) {
      r.done = true; r.pts = 0; save();
      setMsg('no', 'Diesmal nicht geschafft.', `So geht es: ${t.solution}${res.tag ? `<br><br>${E.TAGS[res.tag]}` : ''}`);
      app.querySelectorAll('.opt').forEach(b => b.disabled = true);
      nextButton();
    } else {
      save();
      $('#tries').textContent = `Versuch ${r.tries + 1} von 3`;
      setMsg('no', 'Noch nicht richtig.', res.tag ? E.TAGS[res.tag] : (r.hint ? 'Lies den Tipp noch einmal genau und rechne Schritt für Schritt im Heft.' : 'Rechne noch einmal nach. Wenn du feststeckst, hol dir einen Tipp.'));
    }
  }
  function nextButton() {
    const acts = $('#acts'); acts.innerHTML = '<button class="btn" id="nextBtn">Weiter</button>';
    const b = $('#nextBtn'); b.focus({ preventScroll: true });
    b.addEventListener('click', () => {
      const list = tasksOf(S.hall);
      const nxt = list.findIndex(x => !(S.res[x.id] && S.res[x.id].done));
      if (nxt === -1) {
        if (S.hall === 'X') { S.bonusDone = true; S.screen = 'report'; }
        else { S.got[S.hall] = true; S.screen = 'gate'; }
      } else S.idx = nxt;
      save(); render();
    });
  }

  function renderGate() {
    const h = S.hall, a = AREAS.find(x => x.id === h), lv = lvlOf(h);
    const pts = tasksOf(h).reduce((s, t) => s + (S.res[t.id] ? S.res[t.id].pts : 0), 0);
    app.innerHTML = bar() + `<div class="panel reveal">
      <div class="mono" style="color:var(--hazard);font-size:12px;letter-spacing:.12em">TOR ${h} · ${a.hall.toUpperCase()}</div>
      <h2 class="sign" style="font-size:clamp(26px,5vw,40px)">Das Tor ist offen!</h2>
      <p class="muted" style="margin:0">Auf der Innenseite des Rolltors klebt ein Etikett mit einer Ziffer. Sie steht jetzt auf deinem Codezettel.</p>
      <div class="bigdigit" aria-label="Ziffer ${S.digits[h]}">${S.digits[h]}</div>
      <p class="muted" style="margin:0">${pts} von 8 Punkten auf ${LV[lv].short}.</p>
      ${h === 'E' ? '' : `<p class="suggest" style="margin:6px 0 0">${pts >= 7 && lv < 3 ? `Das lief richtig gut. Trau dir in der nächsten Halle <b>${LV[lv + 1].short}</b> zu.` : pts <= 3 && lv > 1 ? `Das war schwer. In der nächsten Halle hilft dir vielleicht <b>${LV[lv - 1].short}</b>.` : 'Wähle die Stufe für die nächste Halle.'}</p>
      ${levelCards(S.level, 'gl')}`}
      <button class="btn" id="goMap">${h === 'E' ? 'Zum Ausgang' : 'Weiter zum Hallenplan'}</button></div>`;
    if (h !== 'E') wireLevels(l => { S.level = l; save(); });
    $('#goMap').addEventListener('click', () => { S.screen = h === 'E' ? 'exit' : 'map'; save(); render(); });
  }

  function renderExit() {
    app.innerHTML = bar() + `<div class="panel reveal">
      <div class="hazard" style="width:100%"></div>
      <h2 class="sign" style="font-size:clamp(26px,5vw,40px)">Haupttor</h2>
      <p style="margin:0;max-width:52ch">Das Schloss will alle fünf Ziffern von deinem Codezettel, in der Reihenfolge der Hallen <b>A bis E</b>.</p>
      <form id="vaultForm" autocomplete="off" style="display:grid;gap:14px;justify-items:center">
        <div class="vault">${HALLS.map((h, i) => `<label><input id="v${i}" inputmode="numeric" maxlength="1" aria-label="Ziffer Halle ${h}"><span class="cap">${h}</span></label>`).join('')}</div>
        <button class="btn" type="submit">Tor öffnen</button>
      </form>
      <div id="vmsg" aria-live="polite"></div></div>`;
    const ins = HALLS.map((_, i) => $('#v' + i));
    ins[0].focus({ preventScroll: true });
    ins.forEach((inp, i) => inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(-1); if (inp.value && ins[i + 1]) ins[i + 1].focus(); }));
    $('#vaultForm').addEventListener('submit', ev => {
      ev.preventDefault();
      const code = ins.map(i => i.value).join(''), want = HALLS.map(h => S.digits[h]).join('');
      if (code === want) { S.escaped = true; S.finishedAt = S.finishedAt || Date.now(); S.screen = 'report'; save(); render(); }
      else $('#vmsg').innerHTML = '<div class="msg no" style="text-align:left"><b>Das Schloss klickt nicht.</b>Schau auf deinen Codezettel oben rechts und achte auf die Reihenfolge A bis E.</div>';
    });
  }

  // ---------- Auswertung ----------
  const AREA_TIPS = {
    A: 'Übersetze Schritt für Schritt und probiere die Anweisung zuerst mit einer echten Zahl aus.',
    B: 'Setze negative Zahlen immer in Klammern ein und rechne erst Potenzen, dann Punkt vor Strich.',
    C: 'Fasse nur Glieder mit derselben Variablen und derselben Hochzahl zusammen.',
    D: 'Multipliziere die Zahlen, schreibe die Variablen dahinter und denk an x · x = x².',
    E: 'Mache auf beiden Seiten dasselbe und prüfe dein Ergebnis mit der Probe.',
  };
  const STRENGTH = {
    A: 'Du übersetzt Texte und Situationen sicher in Terme.', B: 'Du setzt sicher ein, auch negative Zahlen.', C: 'Du erkennst gleichartige Glieder und fasst sicher zusammen.',
    D: 'Du vereinfachst Produkte sicher.', E: 'Du löst Gleichungen sicher.',
  };
  function areaResult(h) {
    const pts = tasksOf(h).reduce((s, t) => s + (S.res[t.id] ? S.res[t.id].pts : 0), 0);
    const lv = lvlOf(h); const level = E.ampel(lv, pts);
    const tags = [...new Set(tasksOf(h).flatMap(t => (S.res[t.id] && S.res[t.id].tags) || []))];
    return { pts, level, tags, lv };
  }
  function renderReport() {
    const res = AREAS.map(a => ({ a, ...areaResult(a.id) }));
    const must = res.filter(r => r.level !== 'gruen');
    const word = { gruen: 'grün', gelb: 'gelb', rot: 'rot' };
    const todo = { gruen: 'Station %: nur die Expertenaufgabe', gelb: 'Station %: Standard ist Pflicht', rot: 'Station %: Basis und Standard sind Pflicht' };
    const bonus = tasksOf('X'), bonusPts = bonus.filter(t => S.res[t.id] && S.res[t.id].done && S.res[t.id].pts > 0).length;
    const cards = res.map(r => `<div class="acard">
        <div class="lamp ${r.level}" aria-label="Ampel ${word[r.level]}"><i></i><i></i><i></i></div>
        <div><div class="meta">Halle ${r.a.id} · ${LV[r.lv].short} · ${r.pts} von 8 Punkten</div><h3>${r.a.topic}</h3>
          <p>${r.level === 'gruen' ? STRENGTH[r.a.id] : r.lv === 1 && r.pts >= 7 ? 'Die Grundaufgaben sitzen. Für Grün brauchst du Stufe 2 oder 3, deshalb ist an der Lerntheke Standard dran.' : r.level === 'gelb' ? 'Vieles klappt schon. ' + AREA_TIPS[r.a.id] : 'Hier brauchst du noch Übung. ' + AREA_TIPS[r.a.id]}</p>
          ${r.tags.length ? `<p class="muted" style="margin-top:8px">${r.level === 'gruen' ? 'Achte trotzdem darauf:' : 'Das ist dir passiert:'}</p><ul>${r.tags.map(tg => `<li>${E.TAGS[tg]}</li>`).join('')}</ul>` : ''}
          <span class="todo">→ ${todo[r.level].replace('%', r.a.station)}</span></div></div>`).join('');
    const code = res.map(r => `${r.a.id} ${word[r.level]} (St. ${r.lv})`).join(' · ');
    app.innerHTML = bar() + `
      <div class="report-head">
        <div class="mono" style="color:var(--ok);font-size:12px;letter-spacing:.12em">${S.escaped ? 'AUSGEBROCHEN' : 'ZWISCHENSTAND'} · ${minutes()} ${minutes() === 1 ? 'MINUTE' : 'MINUTEN'}</div>
        <h2 class="sign" style="font-size:clamp(26px,5vw,42px)">Geschafft, ${esc(S.name)}!</h2>
        <p class="lead" style="margin:0">Hier ist deine persönliche Auswertung. Die Ampeln zeigen dir, welche Stationen der Lerntheke für dich Pflicht sind.</p>
      </div>
      <div class="cards">${cards}</div>
      <div class="laufzettel">
        <div class="mono" style="font-size:12px;letter-spacing:.1em">FÜR DEINEN LAUFZETTEL</div>
        <div class="code">${code}</div>
        <div>${must.length ? `Deine Pflichtstationen: <b>${must.map(r => r.a.station).join(', ')}</b>. Beginne mit ${(res.find(r => r.level === 'rot') || must[0]).a.station}.` : 'Alle Ampeln sind grün. An der Lerntheke machst du die Expertenaufgaben und kannst als Experte helfen.'}</div>
        ${S.bonusDone ? `<div>Chefbüro: ${bonusPts} von 4 Expertenaufträgen gelöst.</div>` : ''}
      </div>
      <div class="space"></div>
      <div class="row">
        ${S.bonusDone ? '' : '<button class="btn" id="bonusBtn">Noch Zeit? Ab ins Chefbüro</button>'}
        <span class="confirm" id="restartWrap"><button class="btn ghost" id="restartBtn">Neu starten</button></span>
      </div>`;
    const bb = $('#bonusBtn'); if (bb) bb.addEventListener('click', () => { S.screen = 'hall'; S.hall = 'X'; S.idx = tasksOf('X').findIndex(t => !(S.res[t.id] && S.res[t.id].done)); save(); render(); });
    $('#restartBtn').addEventListener('click', () => {
      $('#restartWrap').innerHTML = '<span class="muted">Deine Auswertung wird gelöscht.</span><button class="btn ghost" id="yes">Ja, neu starten</button><button class="btn ghost" id="no">Abbrechen</button>';
      $('#yes').addEventListener('click', () => { wipe(); S = null; renderStart(); });
      $('#no').addEventListener('click', () => render());
    });
  }

  function render() {
    if (!S) return renderStart();
    window.scrollTo({ top: 0 });
    ({ map: renderMap, hall: renderHall, gate: renderGate, exit: renderExit, report: renderReport }[S.screen] || renderMap)();
  }

  // Minutenanzeige aktualisieren
  setInterval(() => { const w = document.querySelector('.bar .who'); if (w && S) w.textContent = `Schicht 8d · ${S.name} · ${minutes()} min`; }, 30000);

  function start(data) {
    if (data && data.state) boot(data.state);
    render();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ state: S }));
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
